<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Trailer giới thiệu game kinh dị điều tra Lời Nguyền Rừng Thiêng — Bí Mật Biệt Thự Vân Hòa.">
<title>Trailer · Lời Nguyền Rừng Thiêng</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Trailer · Lời Nguyền Rừng Thiêng">
<meta property="og:description" content="Một nhóm bạn, một đêm, một bí mật trong biệt thự Vân Hòa. Game kinh dị điều tra chơi ngay trên trình duyệt.">
<meta property="og:image" content="assets/title_bg.webp">
<link rel="icon" href="assets/logo.webp">
<link rel="stylesheet" href="trailer.css">
<script src="trailer.js" defer></script>
</head>
<body>
<main id="stage" class="stage" aria-label="Trailer game Lời Nguyền Rừng Thiêng">
  <div id="shots" class="shots" aria-hidden="true">
    <div class="shot"><div class="bg"></div></div><div class="shot"><div class="bg"></div></div>
  </div>
  <canvas id="dust" class="dust" aria-hidden="true"></canvas><div class="vignette" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><div class="flare" aria-hidden="true"></div><div class="leak" aria-hidden="true"></div><div id="streak" class="streak" aria-hidden="true"></div><div id="flash" class="flash" aria-hidden="true"></div>
  <div class="bar bar-top" aria-hidden="true"></div><div class="bar bar-bot" aria-hidden="true"></div>
  <div id="cursor" class="cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 2l15 9-6.5 1.6L9.8 19z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg><i></i></div>
  <div id="slate" class="slate" aria-hidden="true"></div>
  <div id="act-label" class="act-label" aria-hidden="true"></div>
  <div id="caps" class="caps" aria-live="polite"></div>

  <section id="start" class="start" aria-label="Xem trailer">
    <p class="start-kicker">MỘT TRẢI NGHIỆM KINH DỊ ĐIỆN ẢNH</p>
    <img class="start-logo" src="assets/logo.webp" alt="Lời Nguyền Rừng Thiêng — Bí Mật Biệt Thự Vân Hòa">
    <p class="start-warn">⚠ Có yếu tố kinh dị · Nên xem với âm thanh bật</p>
    <button id="btn-play" class="btn big" type="button">▶ XEM TRAILER</button>
    <p id="load-status" class="start-load" aria-live="polite"></p>
    <p class="start-hint">Đeo tai nghe để có trải nghiệm tốt nhất</p>
    <a class="return-link" href="index.html">VỀ TRÒ CHƠI</a>
  </section>

  <section id="end" class="end" hidden>
    <img class="end-logo" src="assets/logo.webp" alt="Lời Nguyền Rừng Thiêng">
    <p class="end-tag">Bạn sẽ gọi tên họ chứ?</p>
    <p class="end-meta">MIỄN PHÍ · CHƠI NGAY TRÊN TRÌNH DUYỆT · MÁY TÍNH VÀ ĐIỆN THOẠI</p>
    <p class="end-warn">⚠ CẢNH BÁO · YẾU TỐ KINH DỊ</p>
    <div class="end-btns"><a class="btn big" href="index.html">CHƠI NGAY</a><button id="btn-replay" class="btn" type="button">↺ Xem lại</button><button id="btn-share" class="btn" type="button" hidden>⇪ Chia sẻ</button></div>
  </section>

  <div class="hud" id="hud" hidden>
    <button id="btn-mute" class="hud-btn" type="button" aria-label="Tắt tiếng" aria-pressed="false">🔊</button><button id="btn-fx" class="hud-btn fx-btn" type="button" aria-label="Giảm hiệu ứng chớp" aria-pressed="false">GIẢM NHÁY</button><button id="btn-skip" class="hud-btn" type="button">BỎ QUA ›</button>
  </div>
  <nav id="player" class="player" aria-label="Điều khiển trailer" hidden>
    <button id="btn-pause" class="hud-btn" type="button" aria-label="Tạm dừng">Ⅱ</button>
    <span id="player-time">00:00</span><div class="seek-wrap"><input id="seek" type="range" min="0" max="70" step="0.1" value="0" aria-label="Tiến trình trailer"><div id="chapter-markers" class="chapter-markers" aria-hidden="true"></div></div><span id="player-duration"></span>
  </nav>
  <audio id="audio" src="assets/sound/trailer.mp3" preload="metadata"></audio>
</main>
</body>
</html>
