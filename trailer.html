<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trailer · Lời Nguyền Rừng Thiêng</title>
<meta name="description" content="Trailer giới thiệu game kinh dị điều tra Lời Nguyền Rừng Thiêng — Bí Mật Biệt Thự Vân Hòa.">
<link rel="icon" href="assets/logo.webp">
<link rel="stylesheet" href="trailer.css">
</head>
<body>
<main id="stage" class="stage" aria-label="Trailer game Lời Nguyền Rừng Thiêng">
  <div id="shots" class="shots"></div>
  <div class="vignette"></div><div class="grain"></div><div class="flare"></div><div id="flash" class="flash"></div>
  <div class="bar bar-top"></div><div class="bar bar-bot"></div>
  <div id="caps" class="caps" aria-live="polite"></div>

  <section id="start" class="start">
    <img class="start-logo" src="assets/logo.webp" alt="Lời Nguyền Rừng Thiêng — Bí Mật Biệt Thự Vân Hòa">
    <p class="start-warn">⚠ Có yếu tố kinh dị · Nên xem với âm thanh bật</p>
    <button id="btn-play" class="btn big" type="button">▶ XEM TRAILER</button>
  </section>

  <section id="end" class="end" hidden>
    <img class="end-logo" src="assets/logo.webp" alt="Lời Nguyền Rừng Thiêng">
    <p class="end-tag">Bạn sẽ gọi tên họ chứ?</p>
    <p class="end-warn">⚠ CẢNH BÁO · YẾU TỐ KINH DỊ</p>
    <div class="end-btns"><a class="btn big" href="index.html">CHƠI NGAY</a><button id="btn-replay" class="btn" type="button">↺ Xem lại</button></div>
  </section>

  <div class="hud"><button id="btn-mute" class="hud-btn" type="button" aria-label="Bật/tắt tiếng">🔊</button><button id="btn-skip" class="hud-btn" type="button">BỎ QUA ›</button></div>
  <div id="prog" class="prog"><span></span></div>
</main>
<script src="trailer.js"></script>
</body>
</html>
